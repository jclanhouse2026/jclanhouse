
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JC LAN HOUSE - Vendas e PDV Moderno</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto:wght@400;500;700&family=Open+Sans:wght@400;600;700&family=Playfair+Display:wght@400;700&family=Montserrat:wght@400;600;700&family=Lato:wght@400;700&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0f172a; /* bg-slate-900 */
            color: #f8fafc; /* text-slate-50 */
            font-family: sans-serif;
        }
        #root {
            min-height: 100vh;
        }
    </style>
    <script>
        // Suppress benign Vite WebSocket errors that can trigger unhandled rejections in this environment
        (function() {
            const isViteError = (err) => {
                const msg = err?.message || err?.reason?.message || (typeof err?.reason === 'string' ? err.reason : '');
                return msg && (msg.includes('WebSocket') || msg.includes('[vite]'));
            };

            window.addEventListener('unhandledrejection', (event) => {
                if (isViteError(event)) {
                    event.preventDefault();
                    event.stopImmediatePropagation();
                }
            });

            window.addEventListener('error', (event) => {
                if (isViteError(event)) {
                    event.preventDefault();
                    event.stopImmediatePropagation();
                }
            }, true);
        })();
    </script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
